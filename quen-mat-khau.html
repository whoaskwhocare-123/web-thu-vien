<!DOCTYPE html>
<html lang="vi">
<head>
  <title>Khôi phục mật khẩu | Thư viện trường</title>
  <meta name="description" content="Mô phỏng quy trình khôi phục mật khẩu cổng bạn đọc.">
  <script>document.documentElement.classList.add('js')</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5eee1">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wdth,wght@75..100,400..700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/vendor/bootstrap.min.css"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/auth.css">
</head>
<body>
<a class="skip-link" href="#main">Chuyển đến nội dung chính</a>
<header class="auth-topbar"><div class="container"><a class="auth-brand" href="index.html"><span class="auth-brand-mark" aria-hidden="true">T</span><span>Thư viện trường</span></a></div></header>
<main id="main" class="auth-shell"><div class="container d-flex justify-content-center">

<section class="auth-card" aria-labelledby="auth-title">
 <p class="auth-kicker">Khôi phục tài khoản</p><h1 class="auth-title" id="auth-title">Quên mật khẩu?</h1>
 <p class="auth-muted mb-4">Nhập email trường để mô phỏng quy trình xác minh và đặt mật khẩu mới.</p>
 <div data-forgot-message hidden role="status" aria-live="polite" class="auth-note mb-3"></div>
 <div data-forgot-step-email><label class="form-label" for="forgot-email">Email trường</label><input class="form-control mb-3" id="forgot-email" type="email" autocomplete="email" required placeholder="tenban@truong.edu.vn"><button class="btn btn-primary w-100" type="button" data-forgot-send>Gửi mã xác minh</button></div>
 <div data-forgot-step-code hidden><label class="form-label" for="forgot-code">Mã xác minh 6 số</label><input class="form-control mb-3" id="forgot-code" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" required><button class="btn btn-primary w-100" type="button" data-forgot-verify>Xác minh mã</button></div>
 <div data-forgot-step-reset hidden><div class="mb-3"><label class="form-label" for="new-password">Mật khẩu mới</label><div class="auth-password-wrap"><input class="form-control" id="new-password" type="password" minlength="8" pattern="(?=.*[A-Za-z])(?=.*\d).{8,}" required><button class="auth-toggle" type="button" data-password-toggle="new-password">Hiện</button></div><div class="form-text">Ít nhất 8 ký tự, gồm chữ và số.</div></div><div class="mb-3"><label class="form-label" for="new-password-confirm">Xác nhận mật khẩu mới</label><input class="form-control" id="new-password-confirm" type="password" required></div><button class="btn btn-primary w-100" type="button" data-forgot-reset>Đặt mật khẩu mới</button></div>
 <div class="auth-divider"></div><a class="btn btn-outline-secondary w-100" href="dang-nhap.html">Quay lại đăng nhập</a>
</section></div></main><footer class="auth-footer"><div class="container"><a href="index.html">← Quay về trang chủ</a><p class="mb-0 mt-2">© <span data-year>2026</span> Thư viện trường</p></div></footer><script src="js/vendor/bootstrap.bundle.min.js"></script><script src="js/auth.js"></script></body></html>
